<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HaruLog — Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="intro">
    <div class="intro-logo">
      <div class="logo-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M16 10l6-3v10l-6-3z"/></svg>
      </div>
      <span class="intro-title">HaruLog</span>
    </div>
    <p class="intro-copy">Capture the moments of your day as short story-style videos, automatically woven into a daily blog.<br>Tap the <b>record</b> button below to film a moment, and tap around to explore.</p>
    <span class="intro-badge">✎ Banhaten wireframe · EN</span>
  </header>

  <div class="phone">
    <div class="screen">
      <div class="statusbar">
        <span class="statusbar-time">9:41</span>
        <div class="statusbar-icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8h2v3H1zM6 5h2v6H6zM11 3h2v8h-2zM16 1h1v10h-1z"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="1" width="21" height="11" rx="3"/><rect x="3" y="3" width="14" height="7" rx="1.5" fill="currentColor"/><path d="M24 4.5v4" stroke-linecap="round"/></svg>
        </div>
      </div>
      <div id="app"></div>
    </div>
    <div class="island"></div>
    <div class="home-indicator"></div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
