# XcodeGen fallback — Xcode 16 미만이거나 .xcodeproj가 열리지 않을 때만 사용:
#   brew install xcodegen && cd ios && xcodegen
name: Dailogger
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Dailogger:
    type: application
    platform: iOS
    sources:
      - Dailogger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ekby0104.harulog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "하루의 순간을 영상으로 기록하기 위해 카메라를 사용합니다."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "모먼트 영상의 소리를 녹음하기 위해 마이크를 사용합니다."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "모먼트에 장소를 자동으로 태그하기 위해 위치 정보를 사용합니다."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
